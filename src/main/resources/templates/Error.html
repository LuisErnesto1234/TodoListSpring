<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px gray;
        }
        h1 {
            color: #721c24;
        }
        p {
            color: #721c24;
        }
        a {
            text-decoration: none;
            color: white;
            background-color: #dc3545;
            padding: 10px 15px;
            border-radius: 5px;
        }
        a:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Ocurrió un error</h1>
    <p th:text="${error}">Ha ocurrido un error inesperado.</p>
    <a href="/app/tareas">Volver a la lista de tareas</a>
</div>
</body>
</html>
