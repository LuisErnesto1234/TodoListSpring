<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tareas Todo List 😎</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<!-- Título principal -->
<h2 class="text-3xl font-bold text-gray-800 text-center my-6">
    Bienvenido, aquí puedes organizarte con tus tareas 😌
</h2>

<!-- Tabla de tareas -->
<div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
    <h3 class="text-xl font-semibold text-gray-700 mb-4">Lista de Tareas</h3>

    <table class="w-full border-collapse border border-gray-300 rounded-lg">
        <thead class="bg-gray-200 text-gray-700 uppercase text-sm">
        <tr>
            <th class="p-3 text-left">Nombre</th>
            <th class="p-3 text-left">Descripción</th>
            <th class="p-3 text-left">Estado</th>
            <th class="p-3 text-left">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tareas}" class="border-b border-gray-300 hover:bg-gray-100 transition">
            <td class="p-3" th:text="${t.getNombre()}"></td>
            <td class="p-3" th:text="${t.getDescripcion()}"></td>
            <td class="p-3 font-semibold" th:text="${t.getEstadoTarea()}"></td>
            <td class="p-3 flex gap-2">
                <a th:href="@{tareas/edit/{id}(id=${t.getIdTarea()})}"
                   class="bg-blue-500 text-white px-3 py-1 rounded-md hover:bg-blue-600 transition">
                    Editar
                </a>
                <a href="#" th:onclick="|confirmDelete('/app/tareas/delete/' + ${t.getIdTarea()})|"
                   class="bg-red-500 text-white px-3 py-1 rounded-md hover:bg-red-600 transition">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Script de confirmación para eliminar tareas -->
<script>
    function confirmDelete(url) {
        if (confirm("¿Estás seguro de que deseas eliminar esta tarea?")) {
            window.location.href = url;
        }
    }
</script>

<!-- Sección para agregar tareas -->
<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-6 mt-10">
    <h2 class="text-2xl font-semibold text-gray-700 mb-2">Agregar Tareas</h2>
    <p class="text-gray-600 mb-4">Aquí puedes agregar nuevas tareas para organizarte mejor.</p>

    <form method="post" action="/app/tareas/add" class="space-y-4">
        <div>
            <label for="nombre" class="block text-gray-700 font-medium">Nombre</label>
            <input id="nombre" name="nombre" type="text"
                   class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
        </div>

        <div>
            <label for="des" class="block text-gray-700 font-medium">Descripción</label>
            <input id="des" name="descripcion" type="text"
                   class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
        </div>

        <div>
            <label for="estado" class="block text-gray-700 font-medium">Estado</label>
            <select id="estado" name="estadoTarea"
                    class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
                <option th:each="estado : ${T(com.proyectos.spring.todolistspring.model.EstadoTarea).values()}"
                        th:value="${estado}" th:text="${estado}"></option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded-md shadow-md hover:bg-green-700 transition duration-300">
            Guardar
        </button>
    </form>
</div>

</body>
</html>
