<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar tarea :v</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<h2 class="text-2xl font-bold text-gray-800 mb-4">Editar Tarea</h2>

<form method="post" action="/app/tareas/update" th:object="${tarea}" class="max-w-lg mx-auto bg-white p-6 shadow-lg rounded-lg">

    <!-- Campo oculto para el ID -->
    <input type="hidden" name="idTarea" th:field="*{idTarea}">

    <!-- Nombre -->
    <div class="mb-4">
        <label for="nombre" class="block text-gray-700 font-semibold mb-1">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}"
               class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
    </div>

    <!-- Descripción -->
    <div class="mb-4">
        <label for="des" class="block text-gray-700 font-semibold mb-1">Descripción</label>
        <input id="des" type="text" th:field="*{descripcion}"
               class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
    </div>

    <!-- Estado -->
    <div class="mb-4">
        <label for="estado" class="block text-gray-700 font-semibold mb-1">Estado</label>
        <select id="estado" th:field="*{estadoTarea}"
                class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2">
            <option th:each="estado : ${T(com.proyectos.spring.todolistspring.model.EstadoTarea).values()}"
                    th:value="${estado}" th:text="${estado}" th:selected="${estado == estadoTarea}">
            </option>
        </select>
    </div>

    <!-- Botón de envío -->
    <button type="submit"
            class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md shadow-md hover:bg-blue-700 transition duration-300">
        Actualizar
    </button>
</form>

</body>
</html>
